<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Download Tiny Doctor / 三假小医院</title>
    <style>
        body {
            margin: 0; min-height: 100vh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #0f2942; color: #fff; text-align: center; padding: 24px;
        }
        img { width: 96px; height: 96px; border-radius: 22px; margin-bottom: 20px; }
        h1 { font-size: 22px; font-weight: 600; margin: 0 0 6px; }
        p { color: #9fc0d8; margin: 0 0 28px; font-size: 15px; }
        a.badge {
            display: block; width: 260px; margin: 0 auto 12px;
            padding: 14px 20px; border-radius: 10px;
            background: #2bb3a3; color: #fff; text-decoration: none;
            font-size: 16px; font-weight: 600;
        }
        a.badge.alt { background: rgba(255,255,255,0.12); }
    </style>
</head>
<body>
    <img src="../../tiny-doctor-icon.png" alt="Tiny Doctor">
    <h1>Tiny Doctor &middot; 三假小医院</h1>
    <p>Opening your app store&hellip; 正在打开应用商店&hellip;</p>
    <a class="badge" id="ios" href="https://apps.apple.com/app/id6796879224">App Store &mdash; iPhone / iPad</a>
    <a class="badge alt" id="android" href="https://play.google.com/store/apps/details?id=com.simbino.honghong">Google Play &mdash; Android</a>

    <script>
        (function () {
            var ua = navigator.userAgent;
            // iPadOS 13+ reports a Macintosh UA; multi-touch is the reliable tell.
            var isIOS = /iPhone|iPad|iPod/.test(ua) ||
                        (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
            var isAndroid = /Android/.test(ua);

            var dest;
            if (isIOS) {
                dest = document.getElementById('ios').href;
            } else if (isAndroid) {
                dest = document.getElementById('android').href;
            } else {
                dest = /^zh/i.test(navigator.language || '')
                    ? '../../tiny-doctor-zh.html'
                    : '../../tiny-doctor.html';
            }
            window.location.replace(dest);
        })();
    </script>
</body>
</html>
